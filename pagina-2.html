<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Inside the Look | Charry</title>


    <!-- ==========================
    PRÉ-CARREGAMENTO DA PRIMEIRA IMAGEM
    =========================== -->

    <link
        rel="preload"
        as="image"
        href="./images/pagina-2/desk-1.jpg"
        media="(min-width: 901px)"
    >

    <link
        rel="preload"
        as="image"
        href="./images/pagina-2/mob-1.jpg"
        media="(max-width: 900px)"
    >


    <!-- ==========================
    PRÉ-CARREGAMENTO DO VÍDEO
    =========================== -->

    <link
        rel="preload"
        as="video"
        href="./images/pagina-2/video.mp4"
        type="video/mp4"
    >


    <link
        rel="stylesheet"
        href="./pagina-2.css"
    >

    <script
        src="./pagina-2.js"
        defer
    ></script>
</head>


<body>


    <!-- ==========================
    BANNER 1
    DESKTOP: desk-1.jpg
    MOBILE: mob-1.jpg
    =========================== -->

    <section class="full-banner first-banner">

        <picture>

            <source
                media="(max-width: 900px)"
                srcset="./images/pagina-2/mob-1.jpg"
            >

            <img
                src="./images/pagina-2/desk-1.jpg"
                alt="Inside the Look Charry"
                fetchpriority="high"
                decoding="async"
            >

        </picture>

    </section>


    <!-- ==========================
    BANNER 2
    DESKTOP: desk-2.jpg
    MOBILE: mob-2.jpg
    =========================== -->

    <section class="full-banner">

                srcset="./images/pagina-2/mob-2.jpg"
            >

            <img
                src="./images/pagina-2/desk-2.jpg"
                alt="Inside the Look Charry"
                decoding="async"
            >

        </picture>

    </section>

    <!-- ==========================
    BANNER 5 + VÍDEO

    DESKTOP:
    desk-5.jpg e vídeo lado a lado

    MOBILE:
    mob-5.jpg
    vídeo embaixo
    =========================== -->

    <section class="media-row">


        <!-- IMAGEM 5 -->

        <div class="media-image">

            <picture>

                <source
                    media="(max-width: 900px)"
                    srcset="./images/pagina-2/mob-5.jpg"
                >

                    src="./images/pagina-2/desk-5.jpg"
                    alt="Inside the Look Charry"
                    decoding="async"
                >

            </picture>

        </div>


        <!-- VÍDEO -->

        <div class="media-video">

            <video
                class="product-video"
                autoplay
                muted
                loop
                playsinline
                webkit-playsinline
                preload="auto"
                disablepictureinpicture
                disableremoteplayback
                aria-label="Vídeo Inside the Look Charry"
            >

                <source
                    src="./images/pagina-2/video.mp4"
                    type="video/mp4"
                >

                Seu navegador não suporta a reprodução deste vídeo.

            </video>

        </div>


    </section>
