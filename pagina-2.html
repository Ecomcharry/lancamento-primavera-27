<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Inside the Look | Charry</title>


    <!-- ==========================
    PRÉ-CARREGAMENTO
    PRIMEIRA IMAGEM DESKTOP
    =========================== -->

    <link
        rel="preload"
        as="image"
        href="./images/pagina-2/desk-1.jpg"
        media="(min-width: 901px)"
    >


    <!-- ==========================
    PRÉ-CARREGAMENTO
    PRIMEIRA IMAGEM MOBILE
    =========================== -->

    <link
        rel="preload"
        as="image"
        href="./images/pagina-2/mob-1.jpg"
        media="(max-width: 900px)"
    >


    <!-- ==========================
    PRÉ-CARREGAMENTO VÍDEO
    =========================== -->

    <link
        rel="preload"
        as="video"
        href="./images/pagina-2/video.mp4"
        type="video/mp4"
    >


    <link
        rel="stylesheet"
        href="./pagina-2.css"
    >


    <script
        src="./pagina-2.js"
        defer
    ></script>

</head>


<body>


    <!-- ==========================
    ÁREA 1
    LINHAS ATEMPORAIS
    =========================== -->

    <section
        class="full-banner first-banner clickable-area"
        data-link="https://www.charry.com.br/collections/linhas-atemporais"
        role="link"
        tabindex="0"
        aria-label="Conhecer Linhas Atemporais Charry"
    >

        <picture>

            <source
                media="(max-width: 900px)"
                srcset="./images/pagina-2/mob-1.jpg"
            >

            <img
                src="./images/pagina-2/desk-1.jpg"
                alt="Linhas Atemporais Charry"
                fetchpriority="high"
                decoding="async"
            >

        </picture>

    </section>


    <!-- ==========================
    ÁREA 2
    BLAZER RETO LISTRADO
    =========================== -->

    <section
        class="full-banner clickable-area"
        data-link="https://www.charry.com.br/products/blazer-reto-listrado-com-bolsos?variant=45941083996230"
        role="link"
        tabindex="0"
        aria-label="Conhecer o Blazer Reto Listrado com Bolsos"
    >

        <picture>

            <source
                media="(max-width: 900px)"
                srcset="./images/pagina-2/mob-2.jpg"
            >

            <img
                src="./images/pagina-2/desk-2.jpg"
                alt="Blazer Reto Listrado com Bolsos"
                decoding="async"
            >

        </picture>

    </section>


    <!-- ==========================
    ÁREA 3
    BLAZER RETO LISTRADO
    =========================== -->

    <section
        class="full-banner clickable-area"
        data-link="https://www.charry.com.br/products/blazer-reto-listrado-com-bolsos?variant=45941083996230"
        role="link"
        tabindex="0"
        aria-label="Conhecer o Blazer Reto Listrado com Bolsos"
    >

        <picture>

            <source
                media="(max-width: 900px)"
                srcset="./images/pagina-2/mob-3.jpg"
            >

            <img
                src="./images/pagina-2/desk-3.jpg"
                alt="Blazer Reto Listrado com Bolsos"
                decoding="async"
            >

        </picture>

    </section>


    <!-- ==========================
    ÁREA 4
    CALÇA WIDE LISTRADA
    =========================== -->

    <section
        class="full-banner clickable-area"
        data-link="https://www.charry.com.br/products/calca-wide-listrada-com-bolsos?variant=45941199765574"
        role="link"
        tabindex="0"
        aria-label="Conhecer a Calça Wide Listrada com Bolsos"
    >

        <picture>

            <source
                media="(max-width: 900px)"
                srcset="./images/pagina-2/mob-4.jpg"
            >

            <img
                src="./images/pagina-2/desk-4.jpg"
                alt="Calça Wide Listrada com Bolsos"
                decoding="async"
            >

        </picture>

    </section>


    <!-- ==========================
    ÁREA 5
    VÍDEO + ACESSÓRIOS

    DESKTOP:
    desk-5 + vídeo

    MOBILE:
    vídeo + mob-5
    =========================== -->

    <section
        class="media-row clickable-area"
        data-link="https://www.charry.com.br/collections/acessorios-primavera-27"
        role="link"
        tabindex="0"
        aria-label="Conhecer Acessórios Primavera 27"
    >


        <!-- VÍDEO -->

        <div class="media-video">

            <video
                class="product-video"
                autoplay
                muted
                loop
                playsinline
                webkit-playsinline
                preload="auto"
                disablepictureinpicture
                disableremoteplayback
                aria-label="Acessórios Primavera 27"
            >

                <source
                    src="./images/pagina-2/video.mp4"
                    type="video/mp4"
                >

                Seu navegador não suporta a reprodução deste vídeo.

            </video>

        </div>


        <!-- IMAGEM 5 -->

        <div class="media-image">

            <picture>

                <source
                    media="(max-width: 900px)"
                    srcset="./images/pagina-2/mob-5.jpg"
                >

                <img
                    src="./images/pagina-2/desk-5.jpg"
                    alt="Acessórios Primavera 27"
                    decoding="async"
                >

            </picture>

        </div>

    </section>


    <!-- ==========================
    ÁREA 6
    BLUSA ESTRUTURADA LISTRADA
    =========================== -->

    <section
        class="full-banner clickable-area"
        data-link="https://www.charry.com.br/products/blusa-estruturada-listrada?variant=45941228535878"
        role="link"
        tabindex="0"
        aria-label="Conhecer a Blusa Estruturada Listrada"
    >

        <picture>

            <source
                media="(max-width: 900px)"
                srcset="./images/pagina-2/mob-6.jpg"
            >

            <img
                src="./images/pagina-2/desk-6.jpg"
                alt="Blusa Estruturada Listrada"
                decoding="async"
            >

        </picture>

    </section>


    <!-- ==========================
    ÁREA FINAL
    WHATSAPP

    DESKTOP: desk-8.jpg
    MOBILE: mob-8.jpg
    =========================== -->

    <section
        class="full-banner last-banner clickable-area"
        data-link="https://chat.whatsapp.com/LM0r58rotgbGuj0oB4m6Rk"
        data-new-tab="true"
        role="link"
        tabindex="0"
        aria-label="Entrar no grupo Charry no WhatsApp"
    >

        <picture>

            <source
                media="(max-width: 900px)"
                srcset="./images/pagina-2/mob-8.jpg"
            >

            <img
                src="./images/pagina-2/desk-8.jpg"
                alt="Charry Club"
                decoding="async"
            >

        </picture>

    </section>


    <!-- ==========================
    PUBLICAÇÕES ANTERIORES
    =========================== -->

    <section class="previous-posts">

        <div class="previous-posts-title">
            PUBLICAÇÕES ANTERIORES
        </div>


        <a
            href="./index.html"
            class="previous-post-card"
            aria-label="Ver publicação anterior do Inside the Look"
        >

            <img
                src="./images/pagina-2/pagina-1.jpg"
                alt="Publicação anterior Inside the Look"
                loading="lazy"
                decoding="async"
            >

        </a>

    </section>


</body>

</html>
